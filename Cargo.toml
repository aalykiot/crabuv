[package]
name = "crabuv"
description = "A multi-platform event loop library 🎡"
authors = ["Alex Alikiotis <alexalikiotis5@gmail.com>"]
version = "0.5.4"
repository = "https://gitlab.com/aalykiot/crabuv"
license = "MIT"
readme = "README.md"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
rayon = "1.12.0"
downcast-rs = { version = "2.0.2", default-features = false }
mio = { version = "1.2.4", features = ["os-poll", "net"] }
notify = "8.2.1"
slotmap = "1.1.1"
rand = "0.10.3"
crossterm = "0.29.0"

[dependencies.signal-hook]
version = "0.4.6"
default-features = false
features = ["channel"]

[target.'cfg(unix)'.dependencies.signal-hook]
version = "0.4.6"
default-features = false
features = ["channel", "iterator"]

[target.'cfg(unix)'.dependencies]
rustix = "1.1.6"
signal-hook-mio = { version = "0.3.0", features = ["support-v1_0"] }

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
